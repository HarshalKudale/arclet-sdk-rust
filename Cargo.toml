[package]
name = "knobdeck-sdk"
version = "0.3.0"
edition = "2021"
description = "Declarative Rust SDK for authoring KnobDeck plugins"
license = "MIT"
repository = "https://github.com/HarshalKudale/arclet-sdk-rust"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"

[[bin]]
name = "knobdeck-plugin"
path = "src/bin/knobdeck-plugin.rs"
